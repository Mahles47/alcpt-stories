<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>ALCPT Stories</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="icon" type="image/png" href="icon-96.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0f19">
<style>
:root{
  --bg-deep:#0b0f19;
  --bg-card:#131a2a;
  --bg-elevated:#1c2740;
  --gold:#f0b429;
  --gold-soft:#f7cf5e;
  --gold-glow:rgba(240,180,41,.28);
  --text-primary:#f8fafc;
  --text-secondary:#94a3b8;
  --success:#34d399;
  --danger:#f87171;
  --border:rgba(240,180,41,.16);
  --radius:16px;
  --shadow:0 4px 24px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'IBM Plex Sans Arabic','Segoe UI',Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,var(--bg-deep) 0%,#0f172a 100%);
  background-attachment:fixed;
  color:var(--text-primary);min-height:100vh;overflow-x:hidden;line-height:1.6;
}
button{font-family:inherit}

/* ---------- Header ---------- */
.app-header{position:sticky;top:0;z-index:100;background:rgba(11,15,25,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.app-title{font-size:1.25rem;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-soft));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.app-title img{width:28px;height:28px;border-radius:8px}
.header-actions{display:flex;gap:8px}
.icon-btn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);border-radius:12px;padding:8px 12px;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .25s}
.icon-btn:active{transform:scale(.96)}
.icon-btn .cnt{color:var(--gold);font-weight:700}
.progress-container{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--text-secondary)}
.progress-bar{flex:1;height:6px;background:var(--bg-elevated);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:3px;transition:width .5s;box-shadow:0 0 8px var(--gold-glow)}

.search-box{width:100%;padding:13px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);font-size:1rem;outline:none;transition:all .3s;margin-top:10px}
.search-box:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.search-box::placeholder{color:var(--text-secondary)}

/* tense filter chips */
.tense-filters{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;max-width:800px;margin:0 auto}
.tense-filters::-webkit-scrollbar{display:none}
.tense-chip{flex:0 0 auto;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:7px 14px;border-radius:20px;font-size:.8rem;cursor:pointer;transition:all .25s;white-space:nowrap}
.tense-chip.active{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1207;font-weight:700;border-color:transparent}

/* ---------- Continue card ---------- */
.continue-card{margin:12px 16px 0;max-width:800px;background:linear-gradient(135deg,rgba(240,180,41,.14),rgba(240,180,41,.04));border:1px solid var(--gold);border-radius:var(--radius);padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;box-shadow:0 0 24px rgba(240,180,41,.08)}
@media(min-width:832px){.continue-card{margin:12px auto 0}}
.continue-play{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-soft));display:flex;align-items:center;justify-content:center;color:#1a1207;font-size:1.1rem}
.continue-info{flex:1;min-width:0}
.continue-label{font-size:.75rem;color:var(--gold);font-weight:700}
.continue-title{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue-sub{font-size:.8rem;color:var(--text-secondary)}

/* ---------- Episode list ---------- */
.ep-list{padding:14px 16px 120px;display:grid;gap:10px;max-width:800px;margin:0 auto}
.tense-group-title{color:var(--gold);font-size:.82rem;font-weight:800;margin:14px 4px 2px;letter-spacing:.3px}
.tense-group-title .en{color:var(--text-secondary);font-weight:400;font-size:.75rem}
.ep-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:12px;position:relative}
.ep-card:active{transform:scale(.985)}
.ep-card.completed{border-right:4px solid var(--success)}
.ep-num{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--bg-elevated);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:var(--gold)}
.ep-card.completed .ep-num{background:rgba(52,211,153,.12);color:var(--success);border-color:rgba(52,211,153,.3)}
.ep-info{flex:1;min-width:0}
.ep-title{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-meta{display:flex;gap:10px;font-size:.75rem;color:var(--text-secondary);margin-top:2px}
.ep-state{font-size:1rem;flex:0 0 auto}
.ep-state .inprog{color:var(--gold);font-size:.72rem;font-weight:700}
.empty-list{text-align:center;color:var(--text-secondary);padding:60px 20px;font-size:.95rem}

/* ---------- Player ---------- */
.player{display:none;padding:16px 16px 190px;max-width:800px;margin:0 auto}
.player.active{display:block}
.player-head{position:sticky;top:0;z-index:105;margin:-16px -16px 10px;padding:12px 16px 10px;background:rgba(11,15,25,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);border-radius:0 0 20px 20px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.player-head .player-top{margin-bottom:10px}
.player-head .mode-bar{margin-bottom:0}
.player-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);padding:9px 12px;border-radius:12px;font-size:1rem;cursor:pointer}
.player-heading{flex:1;min-width:0}
.player-title{font-weight:800;font-size:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.icon-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(240,180,41,.1)}
.player-sub{font-size:.75rem;color:var(--gold)}
.player-actions{display:flex;gap:8px}
.mode-bar{display:flex;gap:8px;margin-bottom:14px}
.mode-chip{flex:1;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:9px 6px;border-radius:12px;font-size:.82rem;cursor:pointer;text-align:center;transition:all .25s}
.mode-chip.active{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1207;font-weight:700;border-color:transparent}

.lines{display:grid;gap:10px}
.line{border-radius:var(--radius);padding:12px 14px;border:1px solid transparent;transition:all .3s;cursor:pointer}
.line .speaker{font-size:.72rem;font-weight:800;letter-spacing:.5px;color:var(--gold);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.line .en{direction:ltr;text-align:left;font-size:1rem;line-height:1.75}
.line .ar{color:var(--text-secondary);font-size:.88rem;margin-top:6px;border-top:1px dashed rgba(148,163,184,.2);padding-top:6px}
.line.narrator{background:rgba(148,163,184,.05);border:1px dashed rgba(148,163,184,.15)}
.line.narrator .en{color:#cbd5e1;font-style:italic}
.line.narrator .speaker{color:var(--text-secondary)}
.line.character{background:var(--bg-card);border:1px solid var(--border)}
.line.playing{border-color:var(--gold);box-shadow:0 0 18px var(--gold-glow);background:var(--bg-elevated)}
.line.playing.narrator{background:rgba(240,180,41,.07)}
.line.done .en{color:var(--text-secondary)}
.line.blurred .en,.line.blurred .ar{filter:blur(7px);user-select:none}
.line.blurred{border-style:dashed}
.reveal-hint{font-size:.72rem;color:var(--text-secondary);text-align:center;margin-top:4px}

/* dictation */
.dict-box{direction:ltr}
.dict-input{width:100%;background:var(--bg-deep);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);padding:11px 13px;font-size:.95rem;outline:none;direction:ltr;text-align:left}
.dict-input:focus{border-color:var(--gold)}
.dict-actions{display:flex;gap:8px;margin-top:8px;direction:rtl}
.dict-btn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);padding:7px 14px;border-radius:10px;font-size:.8rem;cursor:pointer}
.dict-btn.check{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1207;font-weight:700;border:none}
.dict-result{margin-top:8px;font-size:.88rem;direction:ltr;text-align:left;line-height:1.9}
.dict-result .ok{color:var(--success)}
.dict-result .bad{color:var(--danger);text-decoration:line-through}
.dict-result .miss{color:var(--gold)}

/* word chips in word-mode */
.lines.word-mode .en span.w{border-radius:6px;padding:0 2px;cursor:pointer;transition:background .2s}
.lines.word-mode .en span.w:active{background:var(--gold-glow)}
.lines.word-mode .en span.w.saved{color:var(--gold);font-weight:700}

/* ---------- Lyrics style (reading & blind modes) ---------- */
.lines.lyric{gap:2px;padding-top:8px}
.lines.lyric .line{background:none;border:none;box-shadow:none;padding:12px 8px;text-align:center;transition:all .45s ease;scroll-margin-top:200px}
.lines.lyric .line .en{font-size:1.02rem;color:var(--text-secondary);opacity:.5;line-height:1.7;text-align:center;transition:all .45s ease}
.lines.lyric .line .speaker{display:none;font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--gold);justify-content:center;margin-bottom:4px}
.lines.lyric .line .ar{margin-top:6px;border-top:none;font-size:.85rem;opacity:.6;text-align:center;transition:all .45s ease}
.lines.lyric .line.narrator .en{font-style:italic}
.lines.lyric .line.done .en{opacity:.3}
.lines.lyric .line.done .ar{opacity:.25}
.lines.lyric .line.playing .en{font-size:1.32rem;font-weight:700;color:var(--text-primary);opacity:1;line-height:1.65}
.lines.lyric .line.playing .speaker{display:flex}
.lines.lyric .line.playing .ar{font-size:.95rem;opacity:.85;color:var(--text-secondary)}
.lines.lyric .line.blurred .en,.lines.lyric .line.blurred .ar{filter:blur(8px)}

/* ---------- Control bar ---------- */
.control-bar{position:fixed;bottom:0;left:0;right:0;z-index:110;background:rgba(11,15,25,.96);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none}
.control-bar.active{display:block}
.control-inner{max-width:800px;margin:0 auto}
.status-text{text-align:center;font-size:.78rem;color:var(--text-secondary);margin-bottom:8px;min-height:1.2em}
.controls{direction:ltr;display:flex;justify-content:center;align-items:center;gap:6px}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.pills{display:flex;gap:6px}
.pill-btn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-secondary);border-radius:999px;padding:5px 12px;font-size:.78rem;cursor:pointer;white-space:nowrap}
.pill-btn.on{border-color:var(--gold);color:var(--gold)}
.ctrl-btn{width:42px;height:42px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ctrl-btn:active{transform:scale(.93)}
.ctrl-btn.skip{flex-direction:column;gap:0;line-height:1;direction:ltr;unicode-bidi:isolate;font-size:.68rem;font-weight:800;letter-spacing:.5px}
.ctrl-btn.main{width:58px;height:58px;background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1207;font-size:1.4rem;border:none;box-shadow:0 4px 18px var(--gold-glow)}
.ctrl-btn.on{border-color:var(--gold);color:var(--gold)}
.toggles{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.toggle-chip{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:6px 13px;border-radius:18px;font-size:.76rem;cursor:pointer;transition:all .25s}
.toggle-chip.on{background:rgba(240,180,41,.12);border-color:var(--gold);color:var(--gold)}

/* ---------- Vocab view ---------- */
.vocab-view{display:none;padding:16px 16px 120px;max-width:800px;margin:0 auto}
.vocab-view.active{display:block}
.vocab-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:10px}
.vocab-word-row{display:flex;align-items:center;gap:10px;direction:ltr}
.vocab-word{font-weight:800;font-size:1.05rem;color:var(--gold);flex:1}
.vocab-sentence{color:var(--text-secondary);font-size:.85rem;direction:ltr;text-align:left;margin-top:5px;line-height:1.6}
.vocab-ep{font-size:.72rem;color:var(--text-secondary);margin-top:5px}
.mini-btn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);border-radius:9px;padding:5px 10px;font-size:.78rem;cursor:pointer}

/* ---------- Settings modal ---------- */
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
.modal.active{display:flex}
.modal-card{background:var(--bg-card);border:1px solid var(--border);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:85vh;overflow-y:auto}
.modal-title{font-weight:800;font-size:1.1rem;margin-bottom:16px;color:var(--gold)}
.field{margin-bottom:16px}
.field label{display:block;font-size:.85rem;color:var(--text-secondary);margin-bottom:7px}
.field select{width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);border-radius:12px;padding:12px;font-size:.92rem;outline:none}
.field input[type=range]{width:100%;accent-color:var(--gold)}
.rate-row{display:flex;align-items:center;gap:12px}
.rate-val{color:var(--gold);font-weight:700;font-size:.9rem;min-width:44px;text-align:center}
.modal-actions{display:flex;gap:10px;margin-top:6px}
.modal-actions .dict-btn{flex:1;padding:12px;font-size:.95rem}

.toast{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);border:1px solid var(--gold);color:var(--text-primary);padding:10px 18px;border-radius:14px;font-size:.85rem;z-index:300;opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:var(--shadow)}
.toast.show{opacity:1}

.lines .en,.player-title,.ep-title{font-family:'Lora',Georgia,'Times New Roman',serif}
.lines .en{letter-spacing:.1px}
.lines.lyric .line.playing .en{font-weight:600}
.app-title{font-family:'Lora',Georgia,serif;letter-spacing:.3px}
.mode-chip,.pill-btn,.icon-btn,.toggle-chip,.dict-btn,.mini-btn{font-weight:500;letter-spacing:.2px}
.ctrl-btn.skip span{font-size:.72rem;font-weight:700;margin:1px 0}
.back-btn svg{display:block}

.quiz-view{display:none;padding:16px 16px 60px;max-width:800px;margin:0 auto}
.quiz-view.active{display:block}
.q-progress{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text-secondary);font-size:.85rem}
.q-bar{flex:1;height:6px;background:var(--bg-elevated);border-radius:6px;overflow:hidden}
.q-bar div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .3s}
.q-streak{font-size:.78rem;color:var(--gold);margin-bottom:8px}
.q-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px}
.q-text{font-family:'Lora',Georgia,serif;font-size:1.15rem;line-height:1.7;text-align:left}
.q-text mark{background:rgba(240,180,41,.2);color:var(--gold-soft);padding:0 3px;border-radius:4px}
.q-opts{display:flex;flex-direction:column;gap:10px}
.q-opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);padding:13px 14px;border-radius:14px;font-size:1rem;cursor:pointer;font-family:'Lora',Georgia,serif;transition:all .2s}
.q-lab{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg-elevated);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:.85rem}
.q-opt.right{border-color:var(--success);background:rgba(52,211,153,.12)}
.q-opt.right .q-lab{background:var(--success);color:#06281c}
.q-opt.wrong{border-color:var(--danger);background:rgba(248,113,113,.12)}
.q-opt.wrong .q-lab{background:var(--danger);color:#2a0a0a}
.q-feed{margin-top:14px;border-radius:14px;padding:14px 16px;border:1px solid var(--border);background:var(--bg-card)}
.q-feed.ok{border-color:rgba(52,211,153,.5)}.q-feed.no{border-color:rgba(248,113,113,.5)}
.q-verdict{font-weight:700;margin-bottom:6px}.q-feed.ok .q-verdict{color:var(--success)}.q-feed.no .q-verdict{color:var(--danger)}
.q-logic{line-height:1.9;color:var(--text-primary);font-size:.95rem}
.q-next{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1207;font-weight:700;font-size:1rem;cursor:pointer}
.q-next.alt{background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border);font-weight:500}
.q-result{text-align:center;padding:30px 4px}
.q-big{font-family:'Lora',serif;font-size:3rem;font-weight:700;color:var(--gold)}
.q-pct{margin:6px 0;font-size:1.05rem}.q-note{color:var(--text-secondary);font-size:.9rem;margin-bottom:10px}
.q-empty{text-align:center;color:var(--text-secondary);padding:60px 10px}
.q-tag{margin-top:4px;font-size:.74rem;color:var(--gold)}
.quiz-chip{border-color:rgba(240,180,41,.4);color:var(--gold-soft)}
.app-title{white-space:nowrap;font-size:1.1rem}
.header-actions{gap:6px}
.mode-bar .mode-chip{font-size:.78rem;padding:9px 4px}
.ep-state{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ep-state:empty{display:none}
.ep-card.completed{border-color:rgba(52,211,153,.35)}
.ep-card.completed .ep-num{background:rgba(52,211,153,.15);color:var(--success)}
.ep-state .inprog{font-size:.74rem}
.q-tag{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:8px;border:1px solid var(--border);white-space:nowrap;margin:0}
.q-tag.good{color:var(--success);border-color:rgba(52,211,153,.5)}
.q-tag.mid{color:var(--gold-soft)}
.q-tag.low{color:var(--danger);border-color:rgba(248,113,113,.5)}
@media (max-width:380px){.app-title{font-size:.95rem}.app-title img{width:26px;height:26px}.header-actions .icon-btn{padding:6px 9px;font-size:.74rem}}
.ep-meta{flex-wrap:wrap;row-gap:0}.ep-meta span{white-space:nowrap}
html,body{overflow-x:hidden}
@media (max-width:380px){.ep-card{padding:12px;gap:8px}.ep-state .q-tag{padding:2px 6px}}
</style>
</head>
<body>

<header class="app-header" id="appHeader">
  <div class="header-top">
    <div class="app-title"><img src="icon-96.png" alt="">ALCPT Stories</div>
    <div class="header-actions">
      <button class="icon-btn" id="vocabBtn">كلماتي <span class="cnt" id="vocabCount">0</span></button>
      <button class="icon-btn" id="settingsBtn">الإعدادات</button>
    </div>
  </div>
  <div class="progress-container">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="progressText" dir="ltr">0 / 251</span>
    <button class="icon-btn" id="mistakesBtn" style="padding:5px 10px;font-size:.76rem;white-space:nowrap">بنك الأخطاء <span class="cnt" id="mistakesCount">0</span></button>
  </div>
  <input class="search-box" id="searchBox" type="search" placeholder="دوّر على حلقة أو كلمة...">
</header>

<div class="tense-filters" id="tenseFilters"></div>
<div id="continueSlot"></div>
<main class="ep-list" id="listView"></main>

<section class="player" id="playerView">
 <div class="player-head">
  <div class="player-top">
    <button class="back-btn" id="backBtn" aria-label="رجوع"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="player-heading">
      <div class="player-title" id="playerTitle"></div>
      <div class="player-sub" id="playerSub"></div>
    </div>
    <div class="player-actions">
      <button class="icon-btn" id="trToggle">الترجمة</button>
    </div>
  </div>
  <div class="mode-bar">
    <button class="mode-chip active" data-mode="normal">قراءة</button>
    <button class="mode-chip" data-mode="blind">إخفاء النص</button>
    <button class="mode-chip" data-mode="dictation">إملاء</button>
    <button class="mode-chip quiz-chip" id="quizChip">اختبار</button>
  </div>
 </div>
  <div class="lines" id="linesContainer"></div>
</section>

<section class="quiz-view" id="quizView">
  <div class="player-top">
    <button class="back-btn" id="quizBackBtn" aria-label="رجوع"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="player-heading"><div class="player-title" id="quizTitle"></div><div class="player-sub" id="quizSub"></div></div>
  </div>
  <div id="quizBody"></div>
</section>

<section class="vocab-view" id="vocabView">
  <div class="player-top">
    <button class="back-btn" id="vocabBackBtn">رجوع</button>
    <div class="player-heading"><div class="player-title">كلماتي الصعبة</div></div>
  </div>
  <div id="vocabList"></div>
</section>

<div class="control-bar" id="controlBar">
  <div class="control-inner">
    <div class="status-row">
      <div class="status-text" id="statusText"></div>
      <div class="pills">
        <button class="pill-btn" id="speedBtn" title="سرعة التشغيل">1x</button>
        <button class="pill-btn" id="sleepBtn" title="مؤقت النوم">مؤقت النوم</button>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn skip" id="back30Btn" title="رجوع 30 ثانية"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 7l-5 5 5 5M18 7l-5 5 5 5"/></svg><span>30</span></button>
      <button class="ctrl-btn main" id="playBtn" aria-label="تشغيل / إيقاف"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctrl-btn skip" id="fwd30Btn" title="تقديم 30 ثانية"><span>30</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7l5 5-5 5M6 7l5 5-5 5"/></svg></button>
    </div>
    <div class="toggles">
      <button class="toggle-chip on" id="autoPlayToggle">تشغيل تلقائي</button>
      <button class="toggle-chip" id="wordModeToggle">وضع الكلمات</button>
      <button class="toggle-chip" id="revealAllBtn" style="display:none">أظهر النص كله</button>
    </div>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-card">
    <div class="modal-title">إعدادات الصوت</div>
    <div class="field">
      <label>صوت الراوي والشخصيات الرجالة</label>
      <select id="voiceMale"></select>
    </div>
    <div class="field">
      <label>صوت الشخصيات الستات</label>
      <select id="voiceFemale"></select>
    </div>
    <div class="field">
      <label>سرعة القراءة</label>
      <div class="rate-row">
        <input type="range" id="rateSlider" min="0.5" max="1.4" step="0.05" value="0.95">
        <span class="rate-val" id="rateValue">0.95</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="dict-btn" id="testVoiceBtn">جرّب الصوت</button>
      <button class="dict-btn check" id="closeSettingsBtn">تمام</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>window.AUDIO_BASE = 'audio/';</script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="quizdata.js"></script>
<script src="quiz.js"></script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }</script>
</body>
</html>
